<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON CIRCUIT — A Cyberpunk RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines"></div>
  <div class="game" id="game">

    <!-- ===== TITLE SCREEN ===== -->
    <div class="screen active" id="screen-title">
      <div class="title-art">
        <h1 class="glitch" data-text="NEON CIRCUIT">NEON CIRCUIT</h1>
        <p class="subtitle">// A CYBERPUNK RPG //</p>
      </div>
      <button class="btn-neon" onclick="startGame()">JACK IN</button>
      <p class="hint">Rated E for Everyone</p>
    </div>

    <!-- ===== STATS HUD ===== -->
    <div class="hud hidden" id="hud">
      <div class="hud-left">
        <span class="hud-name" id="hud-name">V</span>
        <span class="hud-level">LVL <strong id="hud-level">1</strong></span>
      </div>
      <div class="hud-center">
        <div class="bar-group">
          <label>HP</label>
          <div class="bar"><div class="bar-fill bar-hp" id="bar-hp"></div></div>
          <span id="hud-hp">30/30</span>
        </div>
        <div class="bar-group">
          <label>XP</label>
          <div class="bar"><div class="bar-fill bar-xp" id="bar-xp"></div></div>
          <span id="hud-xp">0/20</span>
        </div>
      </div>
      <div class="hud-right">
        <span class="stat-chip">ATK <strong id="hud-atk">5</strong></span>
        <span class="stat-chip">DEF <strong id="hud-def">3</strong></span>
        <span class="stat-chip coin-chip">&#x2B22; <strong id="hud-coins">0</strong></span>
      </div>
    </div>

    <!-- ===== STORY SCREEN ===== -->
    <div class="screen" id="screen-story">
      <div class="story-box">
        <p class="scene-location" id="scene-location"></p>
        <div class="narrative" id="narrative"></div>
      </div>
      <div class="choices" id="choices"></div>
    </div>

    <!-- ===== COMBAT SCREEN ===== -->
    <div class="screen" id="screen-combat">
      <div class="combat-arena">
        <div class="combatant player-side">
          <div class="combatant-sprite">&#x1F916;</div>
          <div class="combatant-name" id="player-combat-name">V</div>
          <div class="bar"><div class="bar-fill bar-hp" id="combat-player-hp"></div></div>
          <span class="combat-hp" id="combat-player-hp-text"></span>
        </div>
        <div class="vs">VS</div>
        <div class="combatant enemy-side">
          <div class="combatant-sprite" id="enemy-sprite">&#x1F47E;</div>
          <div class="combatant-name" id="enemy-name">Enemy</div>
          <div class="bar"><div class="bar-fill bar-enemy" id="combat-enemy-hp"></div></div>
          <span class="combat-hp" id="combat-enemy-hp-text"></span>
        </div>
      </div>
      <div class="combat-log" id="combat-log"></div>
      <div class="combat-actions" id="combat-actions">
        <button class="btn-neon btn-attack" onclick="combatAction('attack')">ATTACK</button>
        <button class="btn-neon btn-defend" onclick="combatAction('defend')">DEFEND</button>
        <button class="btn-neon btn-item" onclick="combatAction('heal')" id="btn-heal">USE MEDKIT (<span id="medkit-count">0</span>)</button>
      </div>
    </div>

    <!-- ===== SHOP SCREEN ===== -->
    <div class="screen" id="screen-shop">
      <div class="shop-header">
        <h2>&#x2B22; RIPPERDOC SHOP</h2>
        <p>"What'll it be, choom?"</p>
        <span class="shop-coins">Your creds: <strong id="shop-coins">0</strong></span>
      </div>
      <div class="shop-items" id="shop-items"></div>
      <button class="btn-neon" onclick="leaveShop()">LEAVE SHOP</button>
    </div>

    <!-- ===== LEVEL UP OVERLAY ===== -->
    <div class="overlay hidden" id="overlay-levelup">
      <h2>LEVEL UP!</h2>
      <p id="levelup-text">You reached level 2!</p>
      <div class="levelup-stats" id="levelup-stats"></div>
      <button class="btn-neon" onclick="closeLevelUp()">CONTINUE</button>
    </div>

    <!-- ===== GAME OVER SCREEN ===== -->
    <div class="screen" id="screen-gameover">
      <div class="gameover-content">
        <h2 class="glitch" data-text="FLATLINED">FLATLINED</h2>
        <p id="gameover-text">Your story ends here... but Night City never sleeps.</p>
        <div class="final-stats" id="final-stats"></div>
        <button class="btn-neon" onclick="startGame()">TRY AGAIN</button>
      </div>
    </div>

    <!-- ===== ENDING SCREEN ===== -->
    <div class="screen" id="screen-ending">
      <div class="ending-content">
        <h2 id="ending-title">ENDING</h2>
        <div class="ending-text" id="ending-text"></div>
        <div class="final-stats" id="ending-stats"></div>
        <button class="btn-neon" onclick="startGame()">PLAY AGAIN</button>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
